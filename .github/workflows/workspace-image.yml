name: Publish Workspace Image

# Builds and publishes ghcr.io/aprovanlabs/workspace, then rolls the ECS
# service onto the new tag.
#
# Both architectures are built on their own native runner — GitHub's arm64
# runners are free for public repositories, and a native arm64 build takes
# about two minutes where QEMU emulation of the same build takes twenty. The
# per-arch images are pushed by digest and stitched into one multi-arch tag,
# so `docker run` on an Apple Silicon laptop and Fargate ARM64 pull from the
# same reference.
#
# Required repository configuration:
#   vars.AWS_DEPLOY_ROLE_ARN — OIDC role for the deploy step (same role the
#     registry-deploy workflow uses). Without it, the image still publishes
#     and the deploy step is skipped.

on:
  push:
    branches: [main]
    paths:
      - "apps/workspace/**"
      - "packages/utdk/**"
      - "packages/mcp-core/**"
      - "infra/**"
      - "pnpm-lock.yaml"
      - "scripts/image.sh"
      - "scripts/deploy-infra.sh"
      - ".github/workflows/workspace-image.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Roll the ECS service onto the new image"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: workspace-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/workspace
  ENVIRONMENT: prd

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    outputs:
      digest-amd64: ${{ steps.export.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.export.outputs.digest-arm64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only; the human-readable tags are attached to the
      # merged manifest in the next job so a tag never points at one arch.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/workspace/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        id: export
        run: |
          arch="${{ matrix.platform }}"
          echo "digest-${arch#linux/}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish manifest
    runs-on: ubuntu-latest
    needs: build
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: tag
        run: echo "tag=$(echo '${{ github.sha }}' | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # `latest` is a convenience for `docker run`; the sha tag is what ECS
      # pins, so a rollback never depends on a mutable reference.
      - name: Merge into a multi-arch tag
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:${{ steps.tag.outputs.tag }}" \
            --tag "$IMAGE:latest" \
            "$IMAGE@${{ needs.build.outputs.digest-amd64 }}" \
            "$IMAGE@${{ needs.build.outputs.digest-arm64 }}"
          docker buildx imagetools inspect "$IMAGE:${{ steps.tag.outputs.tag }}"

  deploy:
    name: Roll the service
    runs-on: ubuntu-latest
    needs: publish
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && (github.event_name == 'push' || inputs.deploy)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      # Pins the tag in SSM and deploys the stack — the same command a laptop
      # runs, so there is no CI-only release path.
      - name: Deploy
        run: ./scripts/deploy-infra.sh "${{ needs.publish.outputs.tag }}"
