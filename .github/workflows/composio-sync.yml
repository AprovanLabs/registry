name: Composio Batch Sync

on:
  schedule:
    # Run weekly on Mondays at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not modify registry.json)"
        type: boolean
        default: false
      concurrency:
        description: "Max parallel providers (default: 5)"
        type: number
        default: 5

env:
  HUSKY: 0

jobs:
  sync:
    name: Composio Batch Sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: pnpm install

      - name: Run Composio batch ingestion
        id: ingest
        run: |
          DRY_RUN="${{ inputs.dry_run || 'false' }}"
          CONCURRENCY="${{ inputs.concurrency || '5' }}"

          EXTRA_ARGS=""
          if [ "$DRY_RUN" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi

          # Run batch ingestion; capture JSON report to file
          pnpm tsx scripts/ingest-composio.ts \
            --batch \
            --concurrency "$CONCURRENCY" \
            $EXTRA_ARGS \
            > /tmp/batch-report.json 2>/tmp/batch-log.txt

          EXIT_CODE=$?

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          # Extract summary fields from the JSON report
          SUCCEEDED=$(jq '.succeeded // 0' /tmp/batch-report.json)
          FAILED=$(jq '.failed // 0' /tmp/batch-report.json)
          SKIPPED_LOW=$(jq '.skippedLowScore // 0' /tmp/batch-report.json)
          SKIPPED_HASH=$(jq '.skippedHashUnchanged // 0' /tmp/batch-report.json)
          BETA=$(jq '.beta // 0' /tmp/batch-report.json)
          TOTAL=$(jq '.tier3Processed // 0' /tmp/batch-report.json)
          FETCHED=$(jq '.fetchedFromApi // 0' /tmp/batch-report.json)

          echo "succeeded=$SUCCEEDED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped_low=$SKIPPED_LOW" >> "$GITHUB_OUTPUT"
          echo "skipped_hash=$SKIPPED_HASH" >> "$GITHUB_OUTPUT"
          echo "beta=$BETA" >> "$GITHUB_OUTPUT"
          echo "tier3_total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "fetched=$FETCHED" >> "$GITHUB_OUTPUT"

          cat /tmp/batch-log.txt
          exit $EXIT_CODE
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        continue-on-error: true

      - name: Count total providers in registry.json
        id: count
        run: |
          TOTAL=$(jq 'length' data/registry.json)
          echo "total_providers=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Check for registry changes
        id: changes
        run: |
          if git diff --quiet data/registry.json; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run != true
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: composio-sync/${{ github.run_id }}
          base: main
          commit-message: |
            chore(registry): Composio batch sync — ${{ steps.ingest.outputs.succeeded }} providers updated

            Automated weekly resync of Composio Tier 3 providers.
          title: "chore(registry): Composio batch sync — ${{ steps.ingest.outputs.succeeded }} providers updated"
          body: |
            ## Composio Batch Sync

            Automated weekly resync of the full Composio catalog (Tier 3 providers).

            ### Summary

            | Metric | Count |
            |--------|-------|
            | Composio apps fetched | ${{ steps.ingest.outputs.fetched }} |
            | Tier 3 providers evaluated | ${{ steps.ingest.outputs.tier3_total }} |
            | Added / updated | ${{ steps.ingest.outputs.succeeded }} |
            | Beta-tagged (score 40–59) | ${{ steps.ingest.outputs.beta }} |
            | Failed | ${{ steps.ingest.outputs.failed }} |
            | Skipped (score < 40) | ${{ steps.ingest.outputs.skipped_low }} |
            | Skipped (hash unchanged) | ${{ steps.ingest.outputs.skipped_hash }} |
            | **Total providers in registry.json** | **${{ steps.count.outputs.total_providers }}** |

            ### Scoring model

            Providers are scored 0–100 based on metadata completeness:
            - `>= 60`: fully registered
            - `40–59`: registered with `beta` tag, excluded from web UI default listing
            - `< 40`: skipped with a warning entry in the batch report

            ### Files changed

            - `data/registry.json` — provider entries added/updated

            ---
            *Generated by the `composio-sync` workflow. Run ID: `${{ github.run_id }}`*
          labels: |
            automation
            registry-sync
          draft: false

      - name: Report ingestion failures
        if: steps.ingest.outputs.exit_code != '0'
        run: |
          echo "::warning::Composio batch ingestion completed with ${{ steps.ingest.outputs.failed }} failures."
          echo "See batch log for details."
          cat /tmp/batch-log.txt
          exit 1
