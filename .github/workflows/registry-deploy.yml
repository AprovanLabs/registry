name: Deploy Registry Web

# Automated deployment of the registry web app, using the exact same script you
# can run locally (scripts/deploy-web.sh). CI only supplies AWS credentials via
# OIDC; bucket / distribution / Cognito config is discovered from SSM parameters
# published by the core infra (with optional vars.* overrides).
#
# The backing services are NOT deployed here. They are a container image now,
# and both building it and rolling the ECS service onto it belong to one
# workflow (workspace-image.yml) so a release is never split across two runs
# that could interleave.
#
# Required repository configuration:
#   vars.AWS_DEPLOY_ROLE_ARN  — OIDC role to assume. Needs, at minimum:
#       ssm:GetParameter on /aprovan/*/{web,env}, s3:PutObject/DeleteObject
#       + s3:ListBucket on the aprovan.com bucket, cloudfront:CreateInvalidation
# Optional overrides (otherwise resolved from SSM): vars.WEB_BUCKET,
#   vars.CLOUDFRONT_DISTRIBUTION_ID, vars.PUBLIC_COGNITO_AUTHORITY,
#   vars.PUBLIC_COGNITO_CLIENT_ID.
# Hosted catalog session: PUBLIC_SESSION_MODE=hosted is baked into the static
# build by scripts/deploy-web.sh (Cognito PKCE + product gateway). Self-hosted /
# local builds leave it unset → standalone.

on:
  push:
    branches: [main]
    paths:
      - "apps/registry/**"
      - "scripts/deploy-web.sh"
      - "scripts/deploy-lib.sh"
      - ".github/workflows/registry-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: registry-deploy-web
  cancel-in-progress: false

env:
  ENVIRONMENT: prd
  # Explicit overrides win over SSM discovery when set as repo vars.
  WEB_BUCKET: ${{ vars.WEB_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
  PUBLIC_COGNITO_AUTHORITY: ${{ vars.PUBLIC_COGNITO_AUTHORITY }}
  PUBLIC_COGNITO_CLIENT_ID: ${{ vars.PUBLIC_COGNITO_CLIENT_ID }}
  # aprovan.com/registry uses Cognito + product gateway (not registry-server).
  PUBLIC_SESSION_MODE: hosted

jobs:
  deploy:
    name: Deploy web
    runs-on: ubuntu-latest
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Deploy
        run: ./scripts/deploy-web.sh
