name: Deploy Registry

# Automated deployment of the registry, using the exact same scripts you can run
# locally (scripts/deploy-web.sh, scripts/deploy-infra.sh). CI only supplies AWS
# credentials via OIDC; bucket / distribution / Cognito config is discovered from
# SSM parameters published by the core infra (with optional vars.* overrides).
#
# Required repository configuration:
#   vars.AWS_DEPLOY_ROLE_ARN  — OIDC role to assume. Needs, at minimum:
#       web:   ssm:GetParameter on /aprovan/*/{web,env}, s3:PutObject/DeleteObject
#              + s3:ListBucket on the aprovan.com bucket, cloudfront:CreateInvalidation
#       infra: the above plus CloudFormation/Lambda/DynamoDB/IAM deploy rights
#              and access to the CDK bootstrap bucket (only if deploy-infra runs)
# Optional overrides (otherwise resolved from SSM): vars.WEB_BUCKET,
#   vars.CLOUDFRONT_DISTRIBUTION_ID, vars.PUBLIC_COGNITO_AUTHORITY,
#   vars.PUBLIC_COGNITO_CLIENT_ID.

on:
  push:
    branches: [main]
    paths:
      - "apps/registry/**"
      - "apps/gateway/**"
      - "infra/**"
      - "packages/utdk/**"
      - "packages/registry-ui/**"
      - "packages/registry-main/**"
      - "scripts/deploy*.sh"
      - ".github/workflows/registry-deploy.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        type: choice
        default: all
        options: [web, infra, all]

permissions:
  contents: read
  id-token: write

concurrency:
  group: registry-deploy
  cancel-in-progress: false

env:
  ENVIRONMENT: prd
  # Explicit overrides win over SSM discovery when set as repo vars.
  WEB_BUCKET: ${{ vars.WEB_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
  PUBLIC_COGNITO_AUTHORITY: ${{ vars.PUBLIC_COGNITO_AUTHORITY }}
  PUBLIC_COGNITO_CLIENT_ID: ${{ vars.PUBLIC_COGNITO_CLIENT_ID }}

jobs:
  deploy:
    name: Deploy (${{ github.event.inputs.target || 'all' }})
    runs-on: ubuntu-latest
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Deploy
        run: ./scripts/deploy.sh "${{ github.event.inputs.target || 'all' }}"
