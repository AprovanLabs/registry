name: Publish Registry Image

# Builds ghcr.io/aprovanlabs/registry (the standalone registry server,
# tech-plan D11), runs the standalone smoke test against the freshly built
# image, and publishes a multi-arch manifest. Mirrors workspace-image.yml.

on:
  push:
    branches: [main]
    paths:
      - "packages/registry-server/**"
      - "packages/utdk/**"
      - "packages/contracts/**"
      - "packages/mcp-core/**"
      - "docker/registry.Dockerfile"
      - "pnpm-lock.yaml"
      - ".github/workflows/registry-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: registry-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/aprovanlabs/registry

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    outputs:
      digest-amd64: ${{ steps.export.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.export.outputs.digest-arm64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Load locally first so the smoke test runs against the exact image.
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/registry.Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=registry-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=registry-${{ matrix.platform }}
          load: true
          tags: aprovan/registry:smoke

      # boot → credential → profile → grant → dispatch → MCP list_tools.
      - name: Standalone smoke test
        run: ./packages/registry-server/scripts/smoke-standalone.sh aprovan/registry:smoke

      - name: Push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/registry.Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=registry-${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        id: export
        run: |
          arch="${{ matrix.platform }}"
          echo "digest-${arch#linux/}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish manifest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: tag
        run: echo "tag=$(echo '${{ github.sha }}' | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Merge into a multi-arch tag
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:${{ steps.tag.outputs.tag }}" \
            --tag "$IMAGE:latest" \
            "$IMAGE@${{ needs.build.outputs.digest-amd64 }}" \
            "$IMAGE@${{ needs.build.outputs.digest-arm64 }}"
          docker buildx imagetools inspect "$IMAGE:${{ steps.tag.outputs.tag }}"
