name: Publish Packages to NPM

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  HUSKY: 0

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm \
            --filter @aprovan/registry-server... \
            --filter @utdk/keyvalue \
            --filter @utdk/events \
            --filter @utdk/vfs \
            --filter @utdk/telemetry \
            --filter utdk \
            --filter @aprovan/runtime \
            build

      - name: Publish stable versions (when new)
        run: |
          failed=""
          for pkg in \
            @utdk/common @utdk/sql @utdk/llm @utdk/sandbox @utdk/vcs @utdk/agent \
            @utdk/keyvalue @utdk/events @utdk/vfs @utdk/telemetry @utdk/mcp-core utdk \
            @aprovan/runtime \
            @aprovan/registry-server; do
            dir=$(pnpm --filter "$pkg" exec pwd 2>/dev/null | tail -1) || continue
            [ -n "$dir" ] || continue
            version=$(node -p "require('$dir/package.json').version")
            if npm view "$pkg@$version" version >/dev/null 2>&1; then
              echo "$pkg@$version already published — skipping"
            else
              echo "Publishing $pkg@$version"
              pnpm --filter "$pkg" publish --no-git-checks --access public || failed="$failed $pkg"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed to publish:$failed"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
